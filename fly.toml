app = "mathua"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

  # The proxy refused connections for ~6s during the 2026-10-22 restart because
  # nothing told it when the app was ready. The check gates traffic until the
  # HTTP listener answers, and grace_period covers loading 1250 concepts and
  # lessons before the first request. /api/health touches no database.
  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

# 256 MB was too small for what this process holds: the Go heap reached 101 MB
# during a burst, the SymPy child holds 57 MB, and the database is 368 MB. The
# kernel then evicted page cache and the process's own pages to the volume,
# /api/health took 17-32 s instead of microseconds, the 2 s health check failed,
# and the proxy answered "could not find a good candidate" to every request.
# Measured on 2026-10-23; see docs/administration.md.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[env]
  # Keep the Go heap well below the machine so page cache survives. Without a
  # limit the collector's default target (2x live heap) is free to take the box.
  GOMEMLIMIT = "700MiB"

[[mounts]]
  source = "mathua_data"
  destination = "/data"
